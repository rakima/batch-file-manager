[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-file-manager"
version = "0.1.0"
description = "A safe desktop tool for managing files in batches"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.gui-scripts]
batch-file-manager = "batch_file_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

